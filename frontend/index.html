<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Prospector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ============================================================
           Reset & Base
           ============================================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary:   #000000;
            --bg-secondary: #0a0a0a;
            --bg-card:      #111111;
            --bg-input:     #1a1a1a;
            --border:       #2a2a2a;
            --border-hover: #444444;
            --text-primary: #fafafa;
            --text-secondary: #a1a1a1;
            --text-muted:   #666666;
            --accent-green: #00c853;
            --accent-red:   #ff4444;
            --accent-blue:  #2196f3;
            --radius:       8px;
            --radius-lg:    12px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* ============================================================
           Layout
           ============================================================ */
        .app {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 32px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #c0c0c0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .logo h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff 0%, #b0b0b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        /* ============================================================
           Tabs
           ============================================================ */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
            font-family: inherit;
        }

        .tab:hover { color: var(--text-secondary); }

        .tab.active {
            color: var(--text-primary);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #ffffff, #888888);
            border-radius: 1px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ============================================================
           Buttons
           ============================================================ */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffffff 0%, #d4d4d4 100%);
            color: #000000;
            box-shadow: 0 1px 2px rgba(255,255,255,0.1);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #f0f0f0 0%, #c0c0c0 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255,255,255,0.15);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
            background: var(--bg-input);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: #ffffff;
        }

        .btn-whatsapp:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }

        .btn-icon {
            padding: 8px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        /* ============================================================
           Forms
           ============================================================ */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
            outline: none;
        }

        .form-input:focus, .form-select:focus {
            border-color: #555;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-select option {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 16px;
            align-items: end;
        }

        /* ============================================================
           Cards
           ============================================================ */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ============================================================
           Search Panel
           ============================================================ */
        .search-panel {
            max-width: 600px;
        }

        .search-panel .card {
            margin-bottom: 20px;
        }

        .search-status {
            margin-top: 16px;
            padding: 16px;
            border-radius: var(--radius);
            background: var(--bg-input);
            border: 1px solid var(--border);
            display: none;
        }

        .search-status.visible { display: block; }

        .search-status.success {
            border-color: #1a3a1a;
            background: #0a1f0a;
        }

        .search-status.error {
            border-color: #3a1a1a;
            background: #1f0a0a;
        }

        .search-status .status-text {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ============================================================
           Config Panel (collapsible)
           ============================================================ */
        .config-panel {
            margin-bottom: 24px;
        }

        .config-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-muted);
            padding: 8px 0;
            border: none;
            background: none;
            font-family: inherit;
            transition: color 0.2s;
        }

        .config-toggle:hover { color: var(--text-secondary); }

        .config-body {
            display: none;
            padding-top: 12px;
        }

        .config-body.open { display: block; }

        .config-body .form-input {
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        /* ============================================================
           Leads Table
           ============================================================ */
        .leads-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .leads-count {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .leads-count strong {
            color: var(--text-primary);
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filters .form-input,
        .filters .form-select {
            width: auto;
            min-width: 160px;
            padding: 8px 12px;
            font-size: 13px;
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            padding: 12px 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            white-space: nowrap;
        }

        tbody td {
            padding: 12px 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: var(--bg-input);
        }

        .lead-name {
            font-weight: 500;
            color: var(--text-primary);
        }

        .lead-phone {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-yes {
            background: rgba(0, 200, 83, 0.12);
            color: #4caf50;
        }

        .badge-no {
            background: rgba(255, 68, 68, 0.08);
            color: #777;
        }

        .status-select {
            padding: 5px 10px;
            font-size: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 100px;
            color: var(--text-primary);
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        .status-select:focus {
            border-color: #555;
        }

        .status-novo     { border-color: #2196f3; color: #64b5f6; }
        .status-contatado { border-color: #ff9800; color: #ffb74d; }
        .status-convertido { border-color: #4caf50; color: #81c784; }
        .status-descartado { border-color: #666; color: #999; }

        .actions-cell {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        /* ============================================================
           Empty state
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state h3 { font-size: 18px; color: var(--text-secondary); margin-bottom: 8px; }
        .empty-state p { font-size: 14px; }

        /* ============================================================
           Spinner
           ============================================================ */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ============================================================
           Toast
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 12px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            animation: slideIn 0.3s ease;
            max-width: 380px;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to   { transform: translateX(0); opacity: 1; }
        }

        /* ============================================================
           Responsive
           ============================================================ */
        @media (max-width: 768px) {
            .form-row, .form-row-3 {
                grid-template-columns: 1fr;
            }

            .leads-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .filters {
                flex-direction: column;
            }

            .filters .form-input,
            .filters .form-select {
                width: 100%;
            }

            .actions-cell {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- ======================================================
         Header
         ====================================================== -->
    <header>
        <div class="logo">
            <div class="logo-icon">⚡</div>
            <h1>Lead Prospector</h1>
        </div>
        <div class="header-actions">
            <button class="btn-icon" onclick="toggleConfig()" title="Configurações">⚙</button>
        </div>
    </header>

    <!-- ======================================================
         Config Panel (collapsible)
         ====================================================== -->
    <div class="config-panel">
        <div class="config-body" id="configBody">
            <div class="card">
                <div class="card-title">⚙ Configurações</div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Supabase URL</label>
                        <input class="form-input" id="cfgSupabaseUrl" placeholder="https://xxx.supabase.co" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Supabase Anon Key</label>
                        <input class="form-input" id="cfgSupabaseKey" placeholder="eyJ..." />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">GitHub Repo (owner/repo)</label>
                        <input class="form-input" id="cfgGithubRepo" placeholder="meu-user/lead-prospector" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">GitHub Token (PAT)</label>
                        <input class="form-input" id="cfgGithubToken" type="password" placeholder="ghp_..." />
                    </div>
                </div>
                <button class="btn btn-primary" onclick="saveConfig()">Salvar configurações</button>
            </div>
        </div>
    </div>

    <!-- ======================================================
         Tabs
         ====================================================== -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('search', this)">🔍 Buscar Leads</button>
        <button class="tab" onclick="switchTab('leads', this)">📋 Meus Leads</button>
    </div>

    <!-- ======================================================
         Tab: Buscar Leads
         ====================================================== -->
    <div class="tab-content active" id="tab-search">
        <div class="search-panel">
            <div class="card">
                <div class="card-title">🔍 Nova busca de leads</div>

                <div class="form-group">
                    <label class="form-label">Nicho</label>
                    <input class="form-input" id="searchNicho" placeholder="Ex: cabeleireiro, advogado, delivery, pet shop..." />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Região</label>
                        <select class="form-select" id="searchRegiao">
                            <option value="">Selecione a região...</option>
                            <optgroup label="País">
                                <option value="Brasil todo">🇧🇷 Brasil todo</option>
                            </optgroup>
                            <optgroup label="Estados">
                                <option value="São Paulo, SP">São Paulo (estado)</option>
                                <option value="Rio de Janeiro, RJ">Rio de Janeiro (estado)</option>
                                <option value="Minas Gerais, MG">Minas Gerais</option>
                                <option value="Bahia, BA">Bahia</option>
                                <option value="Paraná, PR">Paraná</option>
                                <option value="Rio Grande do Sul, RS">Rio Grande do Sul</option>
                                <option value="Pernambuco, PE">Pernambuco</option>
                                <option value="Ceará, CE">Ceará</option>
                                <option value="Santa Catarina, SC">Santa Catarina</option>
                                <option value="Goiás, GO">Goiás</option>
                                <option value="Distrito Federal, DF">Distrito Federal</option>
                            </optgroup>
                            <optgroup label="Cidades">
                                <option value="São Paulo, SP, Brasil">São Paulo (cidade)</option>
                                <option value="Rio de Janeiro, RJ, Brasil">Rio de Janeiro (cidade)</option>
                                <option value="Belo Horizonte, MG">Belo Horizonte</option>
                                <option value="Brasília, DF">Brasília</option>
                                <option value="Salvador, BA">Salvador</option>
                                <option value="Curitiba, PR">Curitiba</option>
                                <option value="Fortaleza, CE">Fortaleza</option>
                                <option value="Recife, PE">Recife</option>
                                <option value="Porto Alegre, RS">Porto Alegre</option>
                                <option value="Manaus, AM">Manaus</option>
                                <option value="Goiânia, GO">Goiânia</option>
                                <option value="Campinas, SP">Campinas</option>
                                <option value="Florianópolis, SC">Florianópolis</option>
                            </optgroup>
                            <optgroup label="Personalizado">
                                <option value="__custom">✏️ Digitar região manualmente...</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Quantidade de leads</label>
                        <input class="form-input" id="searchQtd" type="number" min="1" max="30" value="10" />
                    </div>
                </div>

                <!-- Custom region input (hidden by default) -->
                <div class="form-group" id="customRegiaoGroup" style="display:none;">
                    <label class="form-label">Região personalizada</label>
                    <input class="form-input" id="customRegiao" placeholder="Ex: Uberlândia, MG" />
                </div>

                <button class="btn btn-primary" id="btnSearch" onclick="dispatchSearch()">
                    🚀 Disparar busca
                </button>

                <div class="search-status" id="searchStatus">
                    <div class="status-text" id="statusText"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ======================================================
         Tab: Meus Leads
         ====================================================== -->
    <div class="tab-content" id="tab-leads">
        <div class="leads-header">
            <div class="leads-count">
                <strong id="leadsTotal">0</strong> leads encontrados
            </div>
            <button class="btn btn-secondary btn-sm" onclick="loadLeads()">
                🔄 Atualizar
            </button>
        </div>

        <div class="filters">
            <input class="form-input" id="filterNicho" placeholder="Filtrar por nicho..." oninput="applyFilters()" />
            <input class="form-input" id="filterRegiao" placeholder="Filtrar por região..." oninput="applyFilters()" />
            <select class="form-select" id="filterStatus" onchange="applyFilters()">
                <option value="">Todos os status</option>
                <option value="novo">🔵 Novo</option>
                <option value="contatado">🟠 Contatado</option>
                <option value="convertido">🟢 Convertido</option>
                <option value="descartado">⚫ Descartado</option>
            </select>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Nicho</th>
                        <th>Região</th>
                        <th>Site</th>
                        <th>Instagram</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="leadsTableBody">
                </tbody>
            </table>
        </div>

        <div class="empty-state" id="emptyState" style="display:none;">
            <div class="icon">📭</div>
            <h3>Nenhum lead encontrado</h3>
            <p>Use a aba "Buscar Leads" para iniciar uma prospecção.</p>
        </div>
    </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ============================================================
// State & Config
// ============================================================

let supabaseClient = null;
let allLeads = [];

function getConfig() {
    return {
        supabaseUrl:  localStorage.getItem('lp_supabase_url') || 'https://sfdjalgezqfppjesjuoh.supabase.co',
        supabaseKey:  localStorage.getItem('lp_supabase_key') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmZGphbGdlenFmcHBqZXNqdW9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MDQwMTYsImV4cCI6MjEwMzk4MDAxNn0.jZp1fc5FmXjYo0ZUUUFGRjuia2DW9esfb_tLHVCuYJM',
        githubRepo:   localStorage.getItem('lp_github_repo') || 'vitorsoares5124-ux/allcance',
        githubToken:  localStorage.getItem('lp_github_token') || '',
    };
}

function saveConfig() {
    localStorage.setItem('lp_supabase_url',  document.getElementById('cfgSupabaseUrl').value.trim());
    localStorage.setItem('lp_supabase_key',  document.getElementById('cfgSupabaseKey').value.trim());
    localStorage.setItem('lp_github_repo',   document.getElementById('cfgGithubRepo').value.trim());
    localStorage.setItem('lp_github_token',  document.getElementById('cfgGithubToken').value.trim());
    initSupabase();
    showToast('✅ Configurações salvas!');
}

function loadConfig() {
    const cfg = getConfig();
    document.getElementById('cfgSupabaseUrl').value = cfg.supabaseUrl;
    document.getElementById('cfgSupabaseKey').value = cfg.supabaseKey;
    document.getElementById('cfgGithubRepo').value = cfg.githubRepo;
    document.getElementById('cfgGithubToken').value = cfg.githubToken;
}

function toggleConfig() {
    const body = document.getElementById('configBody');
    body.classList.toggle('open');
}

function initSupabase() {
    const cfg = getConfig();
    if (cfg.supabaseUrl && cfg.supabaseKey && window.supabase) {
        supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
        return true;
    }
    return false;
}

// ============================================================
// Tabs
// ============================================================

function switchTab(tabName, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

    const activeBtn = el || (tabName === 'search' ? document.querySelectorAll('.tab')[0] : document.querySelectorAll('.tab')[1]);
    if (activeBtn) activeBtn.classList.add('active');
    
    const content = document.getElementById('tab-' + tabName);
    if (content) content.classList.add('active');

    if (tabName === 'leads') loadLeads();
}

// ============================================================
// Region selector
// ============================================================

document.getElementById('searchRegiao').addEventListener('change', function() {
    const customGroup = document.getElementById('customRegiaoGroup');
    if (this.value === '__custom') {
        customGroup.style.display = 'block';
        document.getElementById('customRegiao').focus();
    } else {
        customGroup.style.display = 'none';
    }
});

// ============================================================
// Dispatch Search (trigger GitHub Actions)
// ============================================================

async function dispatchSearch() {
    const cfg = getConfig();

    if (!cfg.githubRepo || !cfg.githubToken) {
        showToast('⚠️ Configure o GitHub Repo e Token nas configurações.', 'error');
        toggleConfig();
        return;
    }

    const nicho = document.getElementById('searchNicho').value.trim();
    const regiaoSelect = document.getElementById('searchRegiao').value;
    const regiao = regiaoSelect === '__custom'
        ? document.getElementById('customRegiao').value.trim()
        : regiaoSelect;
    const quantidade = parseInt(document.getElementById('searchQtd').value) || 10;

    if (!nicho) {
        showToast('⚠️ Informe o nicho.', 'error');
        return;
    }
    if (!regiao) {
        showToast('⚠️ Selecione uma região.', 'error');
        return;
    }

    const btn = document.getElementById('btnSearch');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Disparando...';

    showStatus('⏳ Disparando workflow no GitHub Actions...', 'info');

    try {
        const response = await fetch(
            `https://api.github.com/repos/${cfg.githubRepo}/actions/workflows/scraper.yml/dispatches`,
            {
                method: 'POST',
                headers: {
                    'Accept': 'application/vnd.github.v3+json',
                    'Authorization': `token ${cfg.githubToken}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    ref: 'main',
                    inputs: {
                        nicho: nicho,
                        regiao: regiao,
                        quantidade: String(quantidade),
                    }
                })
            }
        );

        if (response.status === 204 || response.ok) {
            showStatus(
                `✅ Busca disparada! O scraper está rodando no GitHub Actions.<br>` +
                `<small style="color:var(--text-muted)">Nicho: ${nicho} | Região: ${regiao} | Qtd: ${quantidade}<br>` +
                `Os leads aparecerão na aba "Meus Leads" quando o workflow finalizar.</small>`,
                'success'
            );
            showToast('✅ Workflow disparado com sucesso!');
        } else {
            const error = await response.json();
            showStatus(`❌ Erro ao disparar: ${error.message || response.statusText}`, 'error');
            showToast('❌ Erro ao disparar workflow.', 'error');
        }
    } catch (err) {
        showStatus(`❌ Erro de conexão: ${err.message}`, 'error');
        showToast('❌ Falha na conexão.', 'error');
    }

    btn.disabled = false;
    btn.innerHTML = '🚀 Disparar busca';
}

function showStatus(html, type) {
    const el = document.getElementById('searchStatus');
    const text = document.getElementById('statusText');
    el.className = 'search-status visible ' + type;
    text.innerHTML = html;
}

// ============================================================
// Load Leads from Supabase
// ============================================================

async function loadLeads() {
    if (!initSupabase()) {
        showToast('⚠️ Configure o Supabase nas configurações.', 'error');
        return;
    }

    try {
        const { data, error } = await supabaseClient
            .from('leads')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) throw error;

        allLeads = data || [];
        applyFilters();
    } catch (err) {
        showToast(`❌ Erro ao carregar leads: ${err.message}`, 'error');
    }
}

// ============================================================
// Filter & Render Leads
// ============================================================

function applyFilters() {
    const nichoFilter  = document.getElementById('filterNicho').value.toLowerCase();
    const regiaoFilter = document.getElementById('filterRegiao').value.toLowerCase();
    const statusFilter = document.getElementById('filterStatus').value;

    let filtered = allLeads;

    if (nichoFilter) {
        filtered = filtered.filter(l => l.nicho && l.nicho.toLowerCase().includes(nichoFilter));
    }
    if (regiaoFilter) {
        filtered = filtered.filter(l => l.regiao && l.regiao.toLowerCase().includes(regiaoFilter));
    }
    if (statusFilter) {
        filtered = filtered.filter(l => l.status === statusFilter);
    }

    renderLeads(filtered);
}

function renderLeads(leads) {
    const tbody = document.getElementById('leadsTableBody');
    const empty = document.getElementById('emptyState');
    const total = document.getElementById('leadsTotal');

    total.textContent = leads.length;

    if (leads.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
    }

    empty.style.display = 'none';

    tbody.innerHTML = leads.map(lead => {
        const phone = lead.telefone || '';
        const waPhone = phone.replace(/[^\d]/g, '');
        const statusClass = 'status-' + (lead.status || 'novo');

        return `
            <tr>
                <td class="lead-name">${esc(lead.nome)}</td>
                <td class="lead-phone">${esc(phone)}</td>
                <td>${esc(lead.nicho)}</td>
                <td>${esc(lead.regiao)}</td>
                <td>
                    ${lead.tem_site
                        ? `<a href="${esc(lead.site_url)}" target="_blank" class="badge badge-yes">✓ Sim</a>`
                        : '<span class="badge badge-no">✗ Não</span>'
                    }
                </td>
                <td>
                    ${lead.tem_instagram
                        ? `<a href="https://instagram.com/${esc((lead.instagram_handle||'').replace('@',''))}" target="_blank" class="badge badge-yes">${esc(lead.instagram_handle)}</a>`
                        : '<span class="badge badge-no">✗ Não</span>'
                    }
                </td>
                <td>
                    <select class="status-select ${statusClass}" onchange="updateStatus('${lead.id}', this.value)">
                        <option value="novo"       ${lead.status==='novo'       ? 'selected':''}>🔵 Novo</option>
                        <option value="contatado"  ${lead.status==='contatado'  ? 'selected':''}>🟠 Contatado</option>
                        <option value="convertido" ${lead.status==='convertido' ? 'selected':''}>🟢 Convertido</option>
                        <option value="descartado" ${lead.status==='descartado' ? 'selected':''}>⚫ Descartado</option>
                    </select>
                </td>
                <td>
                    <div class="actions-cell">
                        <a href="https://wa.me/${waPhone}" target="_blank" class="btn btn-whatsapp btn-sm">
                            💬 WhatsApp
                        </a>
                    </div>
                </td>
            </tr>
        `;
    }).join('');
}

// ============================================================
// Update Lead Status
// ============================================================

async function updateStatus(leadId, newStatus) {
    if (!supabaseClient) return;

    try {
        const { error } = await supabaseClient
            .from('leads')
            .update({ status: newStatus })
            .eq('id', leadId);

        if (error) throw error;

        // Update local state
        const lead = allLeads.find(l => l.id === leadId);
        if (lead) lead.status = newStatus;

        showToast(`✅ Status atualizado para "${newStatus}"`);
    } catch (err) {
        showToast(`❌ Erro ao atualizar: ${err.message}`, 'error');
    }
}

// ============================================================
// Helpers
// ============================================================

function esc(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = message;
    if (type === 'error') toast.style.borderColor = '#ff4444';
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
}

// ============================================================
// Init
// ============================================================

loadConfig();
initSupabase();
</script>
