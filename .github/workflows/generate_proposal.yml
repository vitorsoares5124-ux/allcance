name: Gerar Proposta Comercial

on:
  workflow_dispatch:
    inputs:
      lead_id:
        description: 'UUID do lead no Supabase'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependências
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Executar Gerador de Proposta
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python proposal/generator.py --lead_id "${{ github.event.inputs.lead_id }}"

      - name: Upload PDF como artefato (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposta-${{ github.event.inputs.lead_id }}
          path: "*.pdf"
          if-no-files-found: ignore
