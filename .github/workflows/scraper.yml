name: Lead Prospector — Scraper

on:
  # Trigger manual via GitHub UI ou API
  workflow_dispatch:
    inputs:
      nicho:
        description: 'Nicho de mercado (ex: cabeleireiro, advogado)'
        required: true
        type: string
      regiao:
        description: 'Região (ex: São Paulo, SP / Brasil todo)'
        required: true
        type: string
      quantidade:
        description: 'Quantidade de leads (1-30)'
        required: true
        type: number
        default: 10

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependências
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Executar scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scraper/scraper.py \
            --nicho "${{ github.event.inputs.nicho }}" \
            --regiao "${{ github.event.inputs.regiao }}" \
            --quantidade ${{ github.event.inputs.quantidade }}

      - name: Upload resultados (fallback JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_id }}
          path: leads_output.json
          if-no-files-found: ignore
